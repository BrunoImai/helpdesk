# ============================================================================
# HelpDesk — ecossistema completo: API (FastAPI) + banco (MongoDB)
#
#   docker compose up --build        # sobe tudo
#   docker compose up -d --build     # sobe em segundo plano
#   docker compose logs -f api       # acompanha os logs da API
#   docker compose down              # derruba (os dados continuam no volume)
#   docker compose down -v           # derruba E apaga os dados
#
# Pré-requisito: arquivo .env na mesma pasta com, no mínimo, SECRET_KEY=...
# ============================================================================

services:
  mongo:
    image: mongo:7
    container_name: helpdesk-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db          # os dados sobrevivem ao reiniciar o container
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Sem "ports": o banco só é acessível pela rede interna do Compose (mais seguro).
    # Para inspecionar com o Compass/mongosh, descomente (apenas na SUA máquina):
    # ports:
    #   - "127.0.0.1:27017:27017"

  api:
    build: .                          # usa o Dockerfile desta pasta
    image: helpdesk-api:latest
    container_name: helpdesk-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy    # só inicia a API quando o Mongo está pronto
    ports:
      - "8000:8000"                   # host:container
    environment:
      # "mongo" é o NOME do serviço acima: o Compose cria um DNS interno para ele
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: helpdesk
      # Vem do arquivo .env (o Compose recusa subir se estiver vazio)
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no arquivo .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

volumes:
  mongo_data:
