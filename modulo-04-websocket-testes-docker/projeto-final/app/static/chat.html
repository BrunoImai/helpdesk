<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HelpDesk — Chat do chamado</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    h1 { font-size: 1.3rem; }
    fieldset { border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 1rem; }
    label { display: block; font-size: .85rem; margin: .5rem 0 .2rem; }
    input, select, button { font: inherit; padding: .5rem; width: 100%; border: 1px solid #9ca3af; border-radius: 6px; }
    button { background: #2563eb; color: #fff; border: 0; cursor: pointer; margin-top: .75rem; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    #log { height: 280px; overflow-y: auto; border: 1px solid #d1d5db; border-radius: 8px; padding: .75rem; background: #f9fafb; }
    .msg { margin: .25rem 0; }
    .msg b { color: #2563eb; }
    .sistema { color: #6b7280; font-style: italic; }
    #form-msg { display: flex; gap: .5rem; margin-top: .75rem; }
    #form-msg button { width: auto; margin: 0; }
    #estado { font-size: .85rem; color: #6b7280; }
  </style>
</head>
<body>
  <h1>HelpDesk — Chat do chamado</h1>

  <fieldset>
    <legend>Conexão</legend>
    <label for="ticket">ID do chamado</label>
    <input id="ticket" placeholder="64b7f0c2a1b2c3d4e5f60718" />

    <label for="modo">Entrar como</label>
    <select id="modo">
      <option value="cliente">Cliente (e-mail do chamado)</option>
      <option value="suporte">Suporte (token JWT)</option>
    </select>

    <label for="credencial" id="rotulo-cred">E-mail do solicitante</label>
    <input id="credencial" placeholder="ana@empresa.com" />

    <button id="conectar">Conectar</button>
    <p id="estado">Desconectado</p>
  </fieldset>

  <div id="log" aria-live="polite"></div>

  <form id="form-msg">
    <input id="texto" placeholder="Digite sua mensagem..." autocomplete="off" disabled />
    <button id="enviar" disabled>Enviar</button>
  </form>

  <script>
    const $ = (id) => document.getElementById(id);
    let socket = null;

    $("modo").addEventListener("change", () => {
      const suporte = $("modo").value === "suporte";
      $("rotulo-cred").textContent = suporte ? "Token JWT (copie do /auth/login)" : "E-mail do solicitante";
      $("credencial").placeholder = suporte ? "eyJhbGciOi..." : "ana@empresa.com";
    });

    function escrever(texto, classe = "") {
      const linha = document.createElement("div");
      linha.className = "msg " + classe;
      linha.append(texto);
      $("log").appendChild(linha);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function escreverMensagem(autor, texto) {
      const linha = document.createElement("div");
      linha.className = "msg";
      const nome = document.createElement("b");
      nome.textContent = autor + ": ";
      linha.append(nome, texto);   // textContent/append evitam injeção de HTML (XSS)
      $("log").appendChild(linha);
      $("log").scrollTop = $("log").scrollHeight;
    }

    function definirConectado(conectado) {
      $("texto").disabled = !conectado;
      $("enviar").disabled = !conectado;
      $("conectar").textContent = conectado ? "Desconectar" : "Conectar";
      $("estado").textContent = conectado ? "Conectado" : "Desconectado";
    }

    $("conectar").addEventListener("click", () => {
      if (socket) { socket.close(); return; }

      const id = $("ticket").value.trim();
      const cred = $("credencial").value.trim();
      const parametro = $("modo").value === "suporte" ? "token" : "email";
      const protocolo = location.protocol === "https:" ? "wss" : "ws";
      const url = `${protocolo}://${location.host}/ws/tickets/${id}?${parametro}=${encodeURIComponent(cred)}`;

      $("log").textContent = "";
      socket = new WebSocket(url);

      socket.onopen = () => definirConectado(true);
      socket.onclose = (e) => {
        definirConectado(false);
        escrever(e.code === 1008 ? "Acesso negado ou chamado inexistente." : "Conexão encerrada.", "sistema");
        socket = null;
      };
      socket.onmessage = (evento) => {
        const dados = JSON.parse(evento.data);
        if (dados.tipo === "historico") {
          dados.mensagens.forEach((m) => escreverMensagem(m.autor, m.texto));
        } else if (dados.tipo === "mensagem") {
          escreverMensagem(dados.autor, dados.texto);
        } else {
          escrever(dados.texto, "sistema");
        }
      };
    });

    $("form-msg").addEventListener("submit", (e) => {
      e.preventDefault();
      const texto = $("texto").value.trim();
      if (socket && texto) {
        socket.send(texto);
        $("texto").value = "";
      }
    });
  </script>
</body>
</html>
