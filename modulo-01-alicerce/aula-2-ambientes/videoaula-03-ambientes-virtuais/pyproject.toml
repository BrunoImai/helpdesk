[tool.poetry]
name = "helpdesk"
version = "0.1.0"
description = "HelpDesk - Trilha Dominando Python para Web"
authors = ["Seu Nome <voce@email.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115"
uvicorn = { extras = ["standard"], version = ">=0.30" }
pydantic = { extras = ["email"], version = ">=2.7" }
pydantic-settings = ">=2.3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.5"
black = ">=24.4"
mypy = ">=1.10"
pytest = ">=8.2"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
